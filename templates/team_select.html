<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>구단 선택 · 니가 해봐 단장</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>{% include '_nav.html' %}<main class="container narrow"><a class="back-link" href="{{ url_for('index') }}">← 메인 메뉴</a><section class="page-head"><p class="eyebrow">NEW DYNASTY</p><h1>어느 구단의 단장이 되시겠습니까?</h1><p class="muted">구단을 선택해 2027시즌을 시작하세요. 구단별 전력·초기 예산 차이가 적용됩니다. 선수 이름과 능력치는 테스트용 가상 데이터입니다.</p></section><form method="post" class="team-select-form"><div class="team-grid">{% for team in teams %}<label class="team-option"><input type="radio" name="team" value="{{ team }}" required><span class="team-card"><span class="team-emblem">⚾</span><strong>{{ team }}</strong><small>2027 DYNASTY</small></span></label>{% endfor %}</div><button class="button primary large full-width" type="submit">선택한 구단으로 시작 →</button></form></main></body></html>
